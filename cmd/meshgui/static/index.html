<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meshnet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 24px;
    text-align: center;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 16px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
  }
  .dot.connected { background: #22c55e; }
  .dot.connecting { background: #eab308; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .info {
    margin-bottom: 24px;
    font-size: 13px;
    color: #94a3b8;
  }
  .info div { margin-bottom: 6px; }
  .info span { color: #cbd5e1; }
  .peers {
    margin-bottom: 24px;
  }
  .peers h3 {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .peer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid #334155;
  }
  .peer .dot { width: 8px; height: 8px; }
  .peer:last-child { border-bottom: none; }
  .no-peers { color: #64748b; font-size: 14px; font-style: italic; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:active { transform: scale(0.98); }
  .btn-connect {
    background: #3b82f6;
    color: white;
  }
  .btn-connect:hover { background: #2563eb; }
  .btn-disconnect {
    background: #334155;
    color: #ef4444;
  }
  .btn-disconnect:hover { background: #3f4f66; }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Meshnet</h1>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status">Disconnected</span>
  </div>

  <div class="info">
    <div>Device: <span id="device">—</span></div>
    <div>Tunnel IP: <span id="tunnel-ip">—</span></div>
  </div>

  <div class="peers">
    <h3>Peers</h3>
    <div id="peer-list"><div class="no-peers">Not connected</div></div>
  </div>

  <button class="btn-connect" id="btn" onclick="toggle()">Connect</button>
</div>

<script>
let connected = false;

async function fetchStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const dot = document.getElementById('dot');
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    const device = document.getElementById('device');
    const tunnelIp = document.getElementById('tunnel-ip');
    const peerList = document.getElementById('peer-list');

    connected = data.connected;
    status.textContent = data.status;
    device.textContent = data.device_name || '—';
    tunnelIp.textContent = data.tunnel_ip || '—';

    dot.className = 'dot';
    if (data.connected) {
      dot.classList.add('connected');
      btn.textContent = 'Disconnect';
      btn.className = 'btn-disconnect';
      btn.disabled = false;
    } else if (data.status === 'Connecting...') {
      dot.classList.add('connecting');
      btn.textContent = 'Connecting...';
      btn.className = 'btn-connect';
      btn.disabled = true;
    } else {
      btn.textContent = 'Connect';
      btn.className = 'btn-connect';
      btn.disabled = false;
    }

    if (data.peers && data.peers.length > 0) {
      peerList.innerHTML = data.peers.map(p =>
        `<div class="peer">
          <div class="dot ${p.online ? 'connected' : ''}"></div>
          <span>${p.name}</span>
        </div>`
      ).join('');
    } else if (data.connected) {
      peerList.innerHTML = '<div class="no-peers">No peers online</div>';
    } else {
      peerList.innerHTML = '<div class="no-peers">Not connected</div>';
    }
  } catch (e) {}
}

async function toggle() {
  const endpoint = connected ? '/api/disconnect' : '/api/connect';
  try {
    await fetch(endpoint, { method: 'POST' });
  } catch (e) {}
  setTimeout(fetchStatus, 300);
}

fetchStatus();
setInterval(fetchStatus, 2000);
</script>
</body>
</html>
